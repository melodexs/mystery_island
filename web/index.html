<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mystery Island</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2728%27%3E%F0%9F%97%BC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- TITLE SCREEN -->
  <section id="screen-title" class="screen active">
    <div class="bg" style="background-image:url('img/title.jpg')"></div>
    <div class="shade"></div>
    <div class="title-box">
      <h1>MYSTERY ISLAND</h1>
      <p class="tag">A dark lighthouse. A broken bridge. One chance at rescue.</p>
      <button id="start" class="btn primary big">Choose your survivor</button>
    </div>
  </section>

  <!-- CHARACTER SELECT -->
  <section id="screen-select" class="screen">
    <div class="bg" style="background-image:url('img/beach.jpg')"></div>
    <div class="shade heavy"></div>
    <div class="select-box">
      <h2>Choose your survivor</h2>
      <div id="cards" class="cards"></div>
      <form id="name-form">
        <input id="name-input" type="text" maxlength="20" placeholder="Name your survivor" autocomplete="off">
        <button type="submit" class="btn primary" id="begin" disabled>Begin</button>
      </form>
      <p id="name-error" class="error" hidden>Name must not be empty. Try again.</p>
    </div>
  </section>

  <!-- GAME SCREEN -->
  <section id="screen-game" class="screen">
    <div id="scene" class="bg"></div>
    <div class="shade"></div>

    <header class="hud">
      <div class="hud-left">
        <span class="who"><img id="hud-face" alt=""><span id="hud-name"></span></span>
        <span id="hud-loc" class="loc"></span>
      </div>
      <div class="hud-mid">
        <span class="label">Energy</span>
        <div id="energy" class="energy"></div>
      </div>
      <div class="hud-right">
        <span class="label">Inventory</span>
        <div id="inventory" class="inv"></div>
      </div>
    </header>

    <div id="flash" class="flash"></div>

    <footer class="panel">
      <p id="description" class="desc"></p>
      <p id="message" class="msg"></p>
      <div id="actions" class="actions"></div>
      <button id="quit" class="btn ghost small">Quit</button>
    </footer>
  </section>

  <!-- END SCREEN -->
  <section id="screen-end" class="screen">
    <div id="end-bg" class="bg"></div>
    <div class="shade heavy"></div>
    <div class="title-box">
      <h1 id="end-title"></h1>
      <p id="end-text" class="tag"></p>
      <button id="again" class="btn primary">Play again</button>
    </div>
  </section>

</main>
<script src="game.js"></script>
</body>
</html>
