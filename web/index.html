<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mystery Island</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2728%27%3E%F0%9F%97%BC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <section id="screen-title" class="screen active">
    <div class="bg" style="background-image:url('img/title.jpg')"></div>
    <div class="shade"></div>
    <div class="title-box">
      <h1>MYSTERY ISLAND</h1>
      <p class="tag">A dark lighthouse. A broken bridge. One chance at rescue.</p>
      <button id="start" class="btn primary big">Choose your survivor</button>
    </div>
  </section>

  <section id="screen-select" class="screen">
    <div class="bg" style="background-image:url('img/world_1.jpg')"></div>
    <div class="shade heavy"></div>
    <div class="select-box">
      <h2>Choose your survivor</h2>
      <div id="cards" class="cards"></div>
      <form id="name-form">
        <input id="name-input" type="text" maxlength="20" placeholder="Name your survivor" autocomplete="off">
        <button type="submit" class="btn primary" id="begin" disabled>Set sail</button>
      </form>
      <p id="name-error" class="error" hidden>Name must not be empty. Try again.</p>
    </div>
  </section>

  <section id="screen-boat" class="screen">
    <div id="boat-bg" class="bg boat-bg"></div>
    <div class="shade"></div>
    <div class="lightning" id="boat-bolt"></div>
    <div class="story">
      <p id="story-text"></p>
      <button id="story-next" class="btn primary">Continue</button>
    </div>
    <button id="story-skip" class="btn ghost small skip">Skip</button>
  </section>

  <section id="screen-game" class="screen">
    <canvas id="view"></canvas>
    <div class="lightning" id="bolt"></div>

    <header class="hud">
      <div class="hud-left">
        <span class="who"><img id="hud-face" alt=""><span id="hud-name"></span></span>
        <span id="hud-loc" class="loc"></span>
      </div>
      <div class="hud-mid">
        <span class="label">Energy</span>
        <div id="energy" class="energy"></div>
      </div>
      <div class="hud-right">
        <span class="label">Inventory</span>
        <div id="inventory" class="inv"></div>
      </div>
    </header>

    <div id="goal" class="goal"></div>
    <div id="message" class="toast"></div>
    <div id="prompt" class="prompt"></div>

    <!-- touch controls -->
    <div id="stick" class="stick" aria-label="Move"><div id="knob" class="knob"></div></div>
    <button id="btn-jump" class="tbtn jump" type="button" aria-label="Jump">Jump</button>
    <button id="btn-use" class="tbtn use" type="button" aria-label="Use">Use</button>
    <button id="btn-slide" class="tbtn slide" type="button" aria-label="Slide or crouch">Slide</button>
    <button id="btn-sprint" class="tbtn sprint" type="button" aria-label="Sprint">Sprint</button>

    <div class="corner">
      <button id="mute" class="btn ghost small" type="button">Sound on</button>
      <button id="quit" class="btn ghost small" type="button">Quit</button>
    </div>
    <p class="keys">Run: A / D &nbsp;&middot;&nbsp; Sprint: Shift &nbsp;&middot;&nbsp; Jump: Space / W &nbsp;&middot;&nbsp; Slide / crouch: C or S &nbsp;&middot;&nbsp; Wall-jump: jump against a crate &nbsp;&middot;&nbsp; Use: E</p>
  </section>

  <section id="screen-end" class="screen">
    <div id="end-bg" class="bg"></div>
    <div class="shade heavy"></div>
    <div class="title-box">
      <h1 id="end-title"></h1>
      <p id="end-text" class="tag"></p>
      <button id="again" class="btn primary">Play again</button>
    </div>
  </section>

</main>
<script src="world.js"></script>
<script src="alive.js"></script>
<script src="pose.js"></script>
<script src="main.js"></script>
</body>
</html>
