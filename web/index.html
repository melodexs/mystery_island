<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071014"><title>Mystery Island — Third Person</title>
<link rel="stylesheet" href="third-person.css">
</head>
<body>
<div id="world"></div><div class="vignette"></div>
<section id="intro" class="intro"><div class="intro-card">
<div class="eyebrow">A SURVIVAL EXPLORATION EXPERIENCE</div><h1>MYSTERY<br>ISLAND</h1>
<p>A storm has cut you off from the mainland. Explore the island, recover what the lighthouse keeper left behind, and bring the beacon back to life.</p>
<button id="start" class="btn">Choose your survivor</button>
</div></section>
<header id="hud" class="hud hidden"><div class="hud-identity"><img id="hud-character" src="img/fig_castaway.png" alt=""><div><div class="brand">MYSTERY ISLAND <span style="color:#9caa9f">/ STORM WATCH</span></div><div id="objective" class="objective">Find the rope in the jungle</div></div></div>
<div class="right"><div id="energy" class="energy">♥ ♥ ♥ ♥ ♥</div><div id="inventory" class="inventory">EMPTY</div><div class="stamina"><span id="stamina-fill"></span></div></div></header>
<div id="interaction-hint" class="hint">E · INTERACT</div><div id="toast" class="toast"></div>
<button id="help" class="help">CONTROLS</button>
<div class="mobile">
<div class="cluster"><button data-hold="forward">▲</button><button data-hold="left">◀</button><button data-hold="back">▼</button><button data-hold="right">▶</button></div>
<div class="cluster"><button data-hold="sprint">SPRINT</button><button id="mobile-jump">JUMP</button><button id="mobile-use">USE</button></div>
</div>
<script type="module" src="third-person.js"></script>
</body></html>
